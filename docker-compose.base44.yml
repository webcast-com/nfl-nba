services:
  web:
    image: node:22-alpine
    working_dir: /app
    labels:
      base44.project: "ScoreHub"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: on-failure

volumes:
  node_modules:
